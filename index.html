<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>少年同盟 - 校园友情物语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
        }

        /* 通用样式 */
        .menu-screen {
            padding: 60px 40px;
            text-align: center;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .menu-screen.hidden {
            display: none;
        }

        .menu-title {
            margin-bottom: 50px;
        }

        .menu-title h1 {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 20px;
            color: #666;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .menu-footer {
            color: #999;
            font-size: 14px;
            margin-top: 30px;
        }

        /* 游戏主界面 */
        #game-screen {
            display: flex;
            flex-direction: column;
            height: 700px;
            background: #f0f0f0;
        }

        #game-screen.hidden {
            display: none;
        }

        .game-top-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .game-info {
            display: flex;
            gap: 30px;
        }

        .game-main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .game-canvas-area {
            flex: 1;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 3px solid #667eea;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-sidebar {
            width: 200px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            overflow-y: auto;
        }

        .char-affection {
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .char-name {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .affection-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }

        .affection-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .affection-level {
            font-size: 12px;
            color: #666;
            display: block;
        }

        .dialogue-box {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-speaker {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .dialogue-text {
            color: #333;
            line-height: 1.6;
            min-height: 50px;
            font-size: 15px;
        }

        .dialogue-continue {
            color: #999;
            font-size: 12px;
            text-align: right;
            margin-top: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .choice-box {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-align: left;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .choice-btn:last-child {
            margin-bottom: 0;
        }

        /* 设置面板 */
        .settings-panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .setting-item {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item label {
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .setting-item input[type="range"] {
            flex: 1;
            margin-left: 20px;
        }

        .setting-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-left: 20px;
        }

        .about-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: left;
            max-width: 600px;
            margin: 30px auto;
        }

        .about-content h3 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .about-content h4 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .about-content p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .game-main {
                flex-direction: column;
            }

            .game-sidebar {
                width: 100%;
                height: 150px;
            }

            .menu-title h1 {
                font-size: 40px;
            }

            .menu-screen {
                padding: 30px 20px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 开始菜单 -->
        <div id="start-menu" class="menu-screen">
            <div class="menu-title">
                <h1>🎮 少年同盟</h1>
                <p class="subtitle">校园友情物语</p>
            </div>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="gameManager.startNewGame()">开始游戏</button>
                <button class="menu-btn" onclick="gameManager.showSettings()">游戏设置</button>
                <button class="menu-btn" onclick="gameManager.showAbout()">关于游戏</button>
            </div>
            <div class="menu-footer">
                <p>轻松沙雕 · 青春少年友情 · 无虐心悲剧</p>
            </div>
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="menu-screen hidden">
            <h2>游戏设置</h2>
            <div class="settings-panel">
                <div class="setting-item">
                    <label>文字速度</label>
                    <input type="range" id="text-speed" min="1" max="10" value="5" onchange="gameManager.saveSettings()">
                </div>
                <div class="setting-item">
                    <label>背景音乐音量</label>
                    <input type="range" id="bgm-volume" min="0" max="100" value="50" onchange="gameManager.saveSettings()">
                </div>
                <div class="setting-item">
                    <label>音效音量</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="70" onchange="gameManager.saveSettings()">
                </div>
                <div class="setting-item">
                    <label>自动保存</label>
                    <input type="checkbox" id="auto-save" checked onchange="gameManager.saveSettings()">
                </div>
            </div>
            <button class="menu-btn" onclick="gameManager.showMenu()">返回</button>
        </div>

        <!-- 关于界面 -->
        <div id="about-screen" class="menu-screen hidden">
            <h2>关于游戏</h2>
            <div class="about-content">
                <h3>少年同盟 - 校园友情物语</h3>
                <p>一款轻松沙雕的青春校园友情向游戏</p>
                <p>在校园中自由探索，与三位性格各异的少年建立深厚的友情羁绊。</p>
                <p>通过对话、送礼、小游戏提升好感度，解锁丰富的剧情和结局。</p>
                <br>
                <h4>操作说明：</h4>
                <p>🖱️ 鼠标点击 - 移动到目标位置</p>
                <p>🔤 点击屏幕 - 推进对话</p>
                <p>📦 右侧栏 - 查看角色好感度</p>
                <p>⚙️ 设置 - 调整游戏参数</p>
            </div>
            <button class="menu-btn" onclick="gameManager.showMenu()">返回</button>
        </div>

        <!-- 游戏主画面 -->
        <div id="game-screen" class="hidden">
            <div class="game-top-bar">
                <div class="game-info">
                    <span>📅 第 <span id="day-display">1</span> 天</span>
                    <span>🕐 <span id="time-display">清晨</span></span>
                    <span>📍 <span id="location-display">教室</span></span>
                </div>
                <button class="menu-btn" style="padding: 8px 20px; font-size: 14px;" onclick="gameManager.showGameMenu()">菜单</button>
            </div>

            <div class="game-main">
                <div class="game-canvas-area">
                    <canvas id="game-canvas" width="600" height="500"></canvas>
                </div>

                <div class="game-sidebar">
                    <div id="chars-affection"></div>
                </div>
            </div>

            <div class="dialogue-box" id="dialogue-section">
                <div class="dialogue-speaker" id="dialogue-speaker">游戏</div>
                <div class="dialogue-text" id="dialogue-text">点击开始冒险...</div>
                <div class="dialogue-continue">▼ 点击继续</div>
            </div>

            <div class="choice-box hidden" id="choice-section">
                <div id="choice-list"></div>
            </div>
        </div>

        <!-- 游戏内菜单 -->
        <div id="game-menu" class="menu-screen hidden">
            <h2>游戏菜单</h2>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="gameManager.resumeGame()">继续游戏</button>
                <button class="menu-btn" onclick="gameManager.saveGame()">保存游戏</button>
                <button class="menu-btn" onclick="gameManager.showSettings()">设置</button>
                <button class="menu-btn" onclick="gameManager.backToTitle()">返回标题</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            CANVAS_WIDTH: 600,
            CANVAS_HEIGHT: 500,
            CHARACTERS: [
                { id: 'tiam', name: 'TIAM', color: '#FF6B9D', personality: '调皮捣蛋' },
                { id: 'zize', name: '紫啧', color: '#4ECDC4', personality: '温柔体贴' },
                { id: 'liudai', name: '硫酸钠', color: '#FFE66D', personality: '聪慧冷静' }
            ],
            LOCATIONS: [
                { id: 'classroom', name: '教室', x: 150, y: 150, color: '#8B7355' },
                { id: 'playground', name: '操场', x: 450, y: 150, color: '#90EE90' },
                { id: 'library', name: '图书馆', x: 150, y: 350, color: '#4169E1' },
                { id: 'cafe', name: '食堂', x: 450, y: 350, color: '#FFB6C1' }
            ]
        };

        // 游戏数据
        class GameData {
            constructor() {
                this.day = 1;
                this.time = 'morning'; // morning, noon, evening
                this.location = 'classroom';
                this.affections = {
                    tiam: 0,
                    zize: 0,
                    liudai: 0
                };
                this.inventory = [];
                this.events = [];
            }

            toJSON() {
                return JSON.stringify(this);
            }

            fromJSON(json) {
                const data = JSON.parse(json);
                Object.assign(this, data);
            }
        }

        // 游戏管理器
        class GameManager {
            constructor() {
                this.data = new GameData();
                this.currentDialogue = 0;
                this.dialogueIndex = 0;
                this.canvas = null;
                this.ctx = null;
                this.playerX = 300;
                this.playerY = 250;
                this.targetX = 300;
                this.targetY = 250;
                this.gameState = 'menu'; // menu, playing, dialogue
                this.npcs = this.generateNPCs();
            }

            generateNPCs() {
                return CONFIG.CHARACTERS.map(char => ({
                    ...char,
                    x: Math.random() * 500 + 50,
                    y: Math.random() * 350 + 100,
                    dialogue: this.getCharacterDialogue(char.id)
                }));
            }

            getCharacterDialogue(charId) {
                const dialogues = {
                    tiam: [
                        '哈哈！你来了！我刚才做了个超搞笑的事情！',
                        '你想听听吗？昨天我在教室里...',
                        '算了，太复杂了。你跟我去玩小游戏吧！'
                    ],
                    zize: [
                        '你好呀。我在看最近的新书。',
                        '这本书很有趣，要不要一起看？',
                        '我们可以坐在图书馆的角落里，很安静很舒服。'
                    ],
                    liudai: [
                        '嗯，你来了。',
                        '我正在思考一个有趣的问题。',
                        '你想一起探讨吗？'
                    ]
                };
                return dialogues[charId] || [];
            }

            startNewGame() {
                this.data = new GameData();
                this.gameState = 'playing';
                this.npcs = this.generateNPCs();
                this.showGameScreen();
                this.startGameLoop();
            }

            showGameScreen() {
                this.hideAllScreens();
                document.getElementById('game-screen').classList.remove('hidden');
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.updateUI();
                this.setupCanvasListener();
            }

            setupCanvasListener() {
                this.canvas.addEventListener('click', (e) => {
                    if (this.gameState === 'dialogue') {
                        this.nextDialogue();
                    } else {
                        const rect = this.canvas.getBoundingClientRect();
                        this.targetX = e.clientX - rect.left;
                        this.targetY = e.clientY - rect.top;
                        this.checkNPCInteraction();
                    }
                });
            }

            checkNPCInteraction() {
                for (let npc of this.npcs) {
                    const dx = npc.x - this.playerX;
                    const dy = npc.y - this.playerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 80) {
                        this.startDialogue(npc);
                        return;
                    }
                }
            }

            startDialogue(npc) {
                this.gameState = 'dialogue';
                this.currentNPC = npc;
                this.dialogueIndex = 0;
                this.showDialogue(npc.dialogue[0], npc.name);
            }

            showDialogue(text, speaker) {
                document.getElementById('dialogue-speaker').textContent = speaker;
                document.getElementById('dialogue-text').textContent = text;
                document.getElementById('choice-section').classList.add('hidden');
            }

            nextDialogue() {
                this.dialogueIndex++;
                if (this.dialogueIndex < this.currentNPC.dialogue.length) {
                    this.showDialogue(
                        this.currentNPC.dialogue[this.dialogueIndex],
                        this.currentNPC.name
                    );
                } else {
                    this.endDialogue();
                }
            }

            endDialogue() {
                this.gameState = 'playing';
                this.affectionIncrease(this.currentNPC.id, 10);
                this.updateUI();
            }

            affectionIncrease(charId, amount) {
                if (this.data.affections[charId] !== undefined) {
                    this.data.affections[charId] += amount;
                    if (this.data.affections[charId] > 100) {
                        this.data.affections[charId] = 100;
                    }
                }
            }

            updateUI() {
                const timeLabels = { morning: '清晨', noon: '中午', evening: '傍晚' };
                document.getElementById('day-display').textContent = this.data.day;
                document.getElementById('time-display').textContent = timeLabels[this.data.time] || '清晨';
                document.getElementById('location-display').textContent = this.getCurrentLocationName();

                const affectionHtml = CONFIG.CHARACTERS.map(char => {
                    const aff = this.data.affections[char.id];
                    const level = this.getAffectionLevel(aff);
                    return `
                        <div class="char-affection">
                            <div class="char-name">${char.name}</div>
                            <div class="affection-bar">
                                <div class="affection-fill" style="width: ${aff}%; background: ${char.color};"></div>
                            </div>
                            <div class="affection-level">${level}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('chars-affection').innerHTML = affectionHtml;
            }

            getAffectionLevel(value) {
                if (value < 10) return '陌生';
                if (value < 30) return '熟识';
                if (value < 60) return '友好';
                if (value < 80) return '亲密';
                return '深厚';
            }

            getCurrentLocationName() {
                const loc = CONFIG.LOCATIONS.find(l => l.id === this.data.location);
                return loc ? loc.name : '教室';
            }

            startGameLoop() {
                const gameLoop = () => {
                    this.update();
                    this.draw();
                    requestAnimationFrame(gameLoop);
                };
                gameLoop();
            }

            update() {
                // 玩家移动
                const dx = this.targetX - this.playerX;
                const dy = this.targetY - this.playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 5) {
                    this.playerX += (dx / distance) * 3;
                    this.playerY += (dy / distance) * 3;
                }

                // NPC移动
                this.npcs.forEach(npc => {
                    if (Math.random() < 0.02) {
                        npc.targetX = Math.random() * 500 + 50;
                        npc.targetY = Math.random() * 350 + 100;
                    }
                    const dx = (npc.targetX || npc.x) - npc.x;
                    const dy = (npc.targetY || npc.y) - npc.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 2) {
                        npc.x += (dx / dist) * 1.5;
                        npc.y += (dy / dist) * 1.5;
                    }
                });
            }

            draw() {
                // 清空画布
                this.ctx.fillStyle = '#E8F4F8';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制背景
                this.ctx.fillStyle = '#f0f0f0';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制地点标记
                CONFIG.LOCATIONS.forEach(loc => {
                    this.ctx.fillStyle = loc.color + '30';
                    this.ctx.fillRect(loc.x - 30, loc.y - 30, 60, 60);
                    this.ctx.strokeStyle = loc.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(loc.x - 30, loc.y - 30, 60, 60);
                });

                // 绘制NPC
                this.npcs.forEach(npc => {
                    this.ctx.fillStyle = npc.color;
                    this.ctx.beginPath();
                    this.ctx.arc(npc.x, npc.y, 15, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#333';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(npc.name, npc.x, npc.y + 25);
                });

                // 绘制玩家
                this.ctx.fillStyle = '#667eea';
                this.ctx.beginPath();
                this.ctx.arc(this.playerX, this.playerY, 12, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.fillStyle = '#333';
                this.ctx.font = 'bold 12px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('你', this.playerX, this.playerY + 22);
            }

            showMenu() {
                this.hideAllScreens();
                document.getElementById('start-menu').classList.remove('hidden');
                this.gameState = 'menu';
            }

            showGameMenu() {
                this.hideAllScreens();
                document.getElementById('game-menu').classList.remove('hidden');
            }

            showSettings() {
                this.hideAllScreens();
                document.getElementById('settings-screen').classList.remove('hidden');
            }

            showAbout() {
                this.hideAllScreens();
                document.getElementById('about-screen').classList.remove('hidden');
            }

            resumeGame() {
                this.showGameScreen();
            }

            saveGame() {
                localStorage.setItem('gameData', this.data.toJSON());
                alert('游戏已保存！');
            }

            saveSettings() {
                const settings = {
                    textSpeed: document.getElementById('text-speed').value,
                    bgmVolume: document.getElementById('bgm-volume').value,
                    sfxVolume: document.getElementById('sfx-volume').value,
                    autoSave: document.getElementById('auto-save').checked
                };
                localStorage.setItem('gameSettings', JSON.stringify(settings));
            }

            backToTitle() {
                this.showMenu();
            }

            hideAllScreens() {
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('settings-screen').classList.add('hidden');
                document.getElementById('about-screen').classList.add('hidden');
                document.getElementById('game-menu').classList.add('hidden');
            }
        }

        // 初始化游戏
        const gameManager = new GameManager();
    </script>
</body>
</html>
