<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>少年同盟 - 校园友情物语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        /* 菜单界面 */
        .menu-screen {
            padding: 60px 40px;
            text-align: center;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .menu-screen.hidden {
            display: none;
        }

        .menu-title {
            margin-bottom: 50px;
        }

        .menu-title h1 {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 20px;
            color: #666;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
            align-items: center;
        }

        .menu-btn {
            width: 300px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        /* 游戏主界面 */
        #game-screen {
            display: grid;
            grid-template-columns: 1fr 250px;
            height: 700px;
            background: #f0f0f0;
            gap: 10px;
            padding: 10px;
        }

        #game-screen.hidden {
            display: none;
        }

        .game-canvas-area {
            background: white;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 3px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .game-sidebar {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .char-affection {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 5px;
        }

        .char-name {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .affection-bar {
            width: 100%;
            height: 15px;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin: 5px 0;
        }

        .affection-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .affection-level {
            font-size: 11px;
            color: #666;
            display: block;
        }

        .dialogue-box {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-speaker {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .dialogue-text {
            color: #333;
            line-height: 1.5;
            min-height: 40px;
            font-size: 12px;
        }

        .dialogue-continue {
            color: #999;
            font-size: 10px;
            text-align: right;
            margin-top: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .choice-box {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            margin-top: 5px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            padding: 6px;
            margin-bottom: 5px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            text-align: left;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .game-controls {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .control-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .control-btn:last-child {
            margin-bottom: 0;
        }

        .settings-panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .setting-item {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item label {
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .about-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: left;
            max-width: 600px;
            margin: 30px auto;
        }

        .minigame-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .minigame-screen.hidden {
            display: none;
        }

        .minigame-container {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
        }

        .minigame-title {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .minigame-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .minigame-btn:hover {
            background: #5a6fd6;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            #game-screen {
                grid-template-columns: 1fr;
            }
            .game-sidebar {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 开始菜单 -->
        <div id="start-menu" class="menu-screen">
            <div class="menu-title">
                <h1>🎮 少年同盟</h1>
                <p class="subtitle">校园友情物语</p>
            </div>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="gameManager.startNewGame()">开始游戏</button>
                <button class="menu-btn" onclick="gameManager.showSettings()">游戏设置</button>
                <button class="menu-btn" onclick="gameManager.showAbout()">关于游戏</button>
            </div>
            <div class="menu-footer" style="color: #999; font-size: 14px;">
                <p>轻松沙雕 · 青春少年友情 · 无虐心悲剧</p>
            </div>
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="menu-screen hidden">
            <h2 style="color: #667eea; margin-bottom: 30px;">游戏设置</h2>
            <div class="settings-panel">
                <div class="setting-item">
                    <label>文字速度</label>
                    <input type="range" id="text-speed" min="1" max="10" value="5">
                </div>
                <div class="setting-item">
                    <label>背景音乐音量</label>
                    <input type="range" id="bgm-volume" min="0" max="100" value="50">
                </div>
                <div class="setting-item">
                    <label>音效音量</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="70">
                </div>
            </div>
            <button class="menu-btn" onclick="gameManager.showMenu()">返回</button>
        </div>

        <!-- 关于界面 -->
        <div id="about-screen" class="menu-screen hidden">
            <h2 style="color: #667eea; margin-bottom: 30px;">关于游戏</h2>
            <div class="about-content">
                <h3 style="color: #667eea; margin-bottom: 15px;">少年同盟 - 校园友情物语</h3>
                <p style="color: #666; margin-bottom: 15px;">一款轻松沙雕的青春校园友情向游戏</p>
                <p style="color: #666; margin-bottom: 15px;">与三位性格各异的少年建立深厚的友情羁绊。</p>
                <p style="color: #666; margin-bottom: 15px;">通过对话和小游戏提升好感度，解锁丰富的剧情。</p>
                <br>
                <h4 style="color: #764ba2; margin-bottom: 10px;">游戏特色：</h4>
                <p style="color: #666; margin-bottom: 8px;">✨ TIAM - 清冷天才少年</p>
                <p style="color: #666; margin-bottom: 8px;">✨ 紫啧 - 痞帅运动少年</p>
                <p style="color: #666; margin-bottom: 8px;">✨ 硫代硫酸钠 - 温柔化学少年</p>
                <p style="color: #666; margin-bottom: 8px;">🎮 多种互动小游戏</p>
                <p style="color: #666;">💝 实时好感度系统</p>
            </div>
            <button class="menu-btn" onclick="gameManager.showMenu()">返回</button>
        </div>

        <!-- 游戏主画面 -->
        <div id="game-screen" class="hidden">
            <div class="game-canvas-area">
                <canvas id="game-canvas" width="800" height="600"></canvas>
            </div>

            <div class="game-sidebar">
                <div id="chars-affection"></div>
                <div class="game-controls">
                    <button class="control-btn" onclick="gameManager.saveGame()">💾 保存</button>
                    <button class="control-btn" onclick="gameManager.showMenu()">🏠 菜单</button>
                </div>
                <div class="dialogue-box">
                    <div class="dialogue-speaker" id="dialogue-speaker">游戏</div>
                    <div class="dialogue-text" id="dialogue-text">点击开始冒险...</div>
                    <div class="dialogue-continue">▼ 点击继续</div>
                </div>
            </div>
        </div>

        <!-- 小游戏界面 -->
        <div id="minigame-screen" class="minigame-screen hidden">
            <div class="minigame-container" id="minigame-container"></div>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            CHARACTERS: [
                { id: 'tiam', name: 'TIAM', color: '#3498db', emoji: '📚' },
                { id: 'zize', name: '紫啧', color: '#e74c3c', emoji: '⚽' },
                { id: 'liudai', name: '硫代硫酸钠', color: '#2ecc71', emoji: '🧪' }
            ]
        };

        // ==================== 游戏数据 ====================
        const gameData = {
            affections: { tiam: 0, zize: 0, liudai: 0 }
        };

        // ==================== 对话库 ====================
        const dialogues = {
            tiam: [
                { text: '哦，是你。我刚做完一套数学题。' },
                { text: '有点累了...要去小卖部吗？' }
            ],
            zize: [
                { text: '哟！兄弟！要来单挑一局篮球吗？' },
                { text: '我来教你，保证你学会！' }
            ],
            liudai: [
                { text: '你好呀。我在准备一个化学实验。' },
                { text: '要一起试试吗？很有趣的！' }
            ]
        };

        // ==================== 小游戏 ====================
        const miniGames = {
            rps: {
                play: function(npcId) {
                    let container = document.getElementById('minigame-container');
                    container.innerHTML = `
                        <div class="minigame-title">🎮 猜拳游戏</div>
                        <div style="font-size: 18px; margin: 30px 0;">选择你的出招！</div>
                        <button class="minigame-btn" onclick="miniGames.rps.choose(0, '${npcId}')">✊ 石头</button>
                        <button class="minigame-btn" onclick="miniGames.rps.choose(1, '${npcId}')">✌️ 剪刀</button>
                        <button class="minigame-btn" onclick="miniGames.rps.choose(2, '${npcId}')">✋ 布</button>
                    `;
                },
                choose: function(idx, npcId) {
                    const choices = ['✊ 石头', '✌️ 剪刀', '✋ 布'];
                    const computer = Math.floor(Math.random() * 3);
                    let result = '';
                    let bonus = 0;
                    
                    if (idx === computer) {
                        result = '平手！';
                        bonus = 3;
                    } else if ((idx === 0 && computer === 1) || (idx === 1 && computer === 2) || (idx === 2 && computer === 0)) {
                        result = '你赢了！';
                        bonus = 12;
                    } else {
                        result = '你输了...';
                        bonus = 4;
                    }
                    
                    gameData.affections[npcId] += bonus;
                    let container = document.getElementById('minigame-container');
                    container.innerHTML = `
                        <div class="minigame-title">${result}</div>
                        <div style="font-size: 18px; margin: 30px 0;">你: ${choices[idx]} vs 对手: ${choices[computer]}</div>
                        <div style="color: #667eea; font-size: 14px; margin-bottom: 20px;">+${bonus} 好感度</div>
                        <button class="minigame-btn" onclick="gameManager.endMinigame()">继续</button>
                    `;
                }
            },
            basketball: {
                play: function(npcId) {
                    let power = 50;
                    let direction = 1;
                    let container = document.getElementById('minigame-container');
                    
                    container.innerHTML = `
                        <div class="minigame-title">🏀 篮球单挑</div>
                        <div style="margin: 30px 0;">
                            <div style="font-size: 48px; margin-bottom: 20px;">🏀</div>
                            <div style="font-size: 16px; margin-bottom: 15px;">力量：<span id="power-val">50</span>%</div>
                            <div style="width: 200px; height: 25px; background: #ddd; border-radius: 12px; overflow: hidden; margin: 0 auto 20px;">
                                <div id="power-bar" style="width: 50%; height: 100%; background: #667eea;"></div>
                            </div>
                            <button class="minigame-btn" onclick="miniGames.basketball.shoot('${npcId}')">投篮！</button>
                        </div>
                    `;
                    
                    this.interval = setInterval(() => {
                        power += direction * 2;
                        if (power >= 100 || power <= 0) direction *= -1;
                        document.getElementById('power-val').textContent = power;
                        document.getElementById('power-bar').style.width = power + '%';
                    }, 50);
                },
                shoot: function(npcId) {
                    clearInterval(this.interval);
                    const power = parseInt(document.getElementById('power-val').textContent);
                    const success = power >= 40 && power <= 70;
                    const bonus = success ? 15 : 5;
                    gameData.affections[npcId] += bonus;
                    
                    let container = document.getElementById('minigame-container');
                    container.innerHTML = `
                        <div class="minigame-title">${success ? '进球了！🎯' : '没进...'}</div>
                        <div style="font-size: 48px; margin: 30px 0;">${success ? '🎉' : '😅'}</div>
                        <div style="color: #667eea; font-size: 14px; margin-bottom: 20px;">+${bonus} 好感度</div>
                        <button class="minigame-btn" onclick="gameManager.endMinigame()">继续</button>
                    `;
                }
            },
            chemistry: {
                play: function(npcId) {
                    const q = { text: 'H₂O是什么？', ans: '水', opt: ['水', '氧气', '氢气'].sort(() => Math.random() - 0.5) };
                    let container = document.getElementById('minigame-container');
                    container.innerHTML = `
                        <div class="minigame-title">🧪 化学实验</div>
                        <div style="font-size: 16px; margin: 30px 0 20px;">${q.text}</div>
                        ${q.opt.map(o => `<button class="minigame-btn" onclick="miniGames.chemistry.answer('${o}', '${q.ans}', '${npcId}')">${o}</button>`).join('')}
                    `;
                },
                answer: function(ans, correct, npcId) {
                    const ok = ans === correct;
                    const bonus = ok ? 12 : 4;
                    gameData.affections[npcId] += bonus;
                    
                    let container = document.getElementById('minigame-container');
                    container.innerHTML = `
                        <div class="minigame-title">${ok ? '答对了！✨' : '答错了...'}</div>
                        <div style="font-size: 16px; margin: 20px 0;">正确答案：${correct}</div>
                        <div style="color: #667eea; font-size: 14px; margin-bottom: 20px;">+${bonus} 好感度</div>
                        <button class="minigame-btn" onclick="gameManager.endMinigame()">继续</button>
                    `;
                }
            }
        };

        // ==================== 游戏管理器 ====================
        const gameManager = {
            canvas: null,
            ctx: null,
            npcs: [],
            playerX: 400,
            playerY: 300,
            targetX: 400,
            targetY: 300,
            dialoguing: false,
            inGame: false,

            startNewGame() {
                gameData.affections = { tiam: 0, zize: 0, liudai: 0 };
                this.inGame = true;
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.npcs = CONFIG.CHARACTERS.map(c => ({
                    id: c.id,
                    name: c.name,
                    x: 150 + Math.random() * 500,
                    y: 150 + Math.random() * 300,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    color: c.color,
                    emoji: c.emoji
                }));
                
                this.updateUI();
                this.setupCanvas();
                this.loop();
            },

            setupCanvas() {
                this.canvas.addEventListener('click', (e) => {
                    if (this.dialoguing) {
                        this.nextDialogue();
                    } else {
                        const rect = this.canvas.getBoundingClientRect();
                        this.targetX = e.clientX - rect.left;
                        this.targetY = e.clientY - rect.top;
                        this.checkCollision();
                    }
                });
            },

            checkCollision() {
                for (let npc of this.npcs) {
                    const dx = npc.x - this.playerX;
                    const dy = npc.y - this.playerY;
                    if (Math.hypot(dx, dy) < 120) {
                        this.startDialogue(npc);
                        return;
                    }
                }
            },

            startDialogue(npc) {
                this.dialoguing = true;
                this.currentNPC = npc;
                this.dialogueIdx = 0;
                this.showDialogue();
            },

            showDialogue() {
                const d = dialogues[this.currentNPC.id][this.dialogueIdx];
                document.getElementById('dialogue-speaker').textContent = this.currentNPC.name;
                document.getElementById('dialogue-text').textContent = d.text;
            },

            nextDialogue() {
                this.dialogueIdx++;
                if (this.dialogueIdx < dialogues[this.currentNPC.id].length) {
                    this.showDialogue();
                } else {
                    this.startMinigame();
                }
            },

            startMinigame() {
                this.dialoguing = false;
                const games = ['rps', 'basketball', 'chemistry'];
                const game = games[Math.floor(Math.random() * 3)];
                document.getElementById('minigame-screen').classList.remove('hidden');
                miniGames[game].play(this.currentNPC.id);
            },

            endMinigame() {
                document.getElementById('minigame-screen').classList.add('hidden');
                this.updateUI();
            },

            update() {
                const dx = this.targetX - this.playerX;
                const dy = this.targetY - this.playerY;
                const dist = Math.hypot(dx, dy);
                
                if (dist > 5) {
                    this.playerX += (dx / dist) * 4;
                    this.playerY += (dy / dist) * 4;
                }
                
                this.npcs.forEach(npc => {
                    npc.x += npc.vx;
                    npc.y += npc.vy;
                    if (npc.x < 50 || npc.x > 750) npc.vx *= -1;
                    if (npc.y < 50 || npc.y > 550) npc.vy *= -1;
                });
            },

            draw() {
                this.ctx.fillStyle = '#E8F4F8';
                this.ctx.fillRect(0, 0, 800, 600);
                
                this.npcs.forEach(npc => {
                    this.ctx.fillStyle = npc.color;
                    this.ctx.beginPath();
                    this.ctx.arc(npc.x, npc.y, 20, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '16px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(npc.emoji, npc.x, npc.y + 2);
                    this.ctx.fillStyle = '#333';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.fillText(npc.name, npc.x, npc.y + 35);
                });
                
                this.ctx.fillStyle = '#667eea';
                this.ctx.beginPath();
                this.ctx.arc(this.playerX, this.playerY, 15, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.fillStyle = '#fff';
                this.ctx.font = '16px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('👤', this.playerX, this.playerY + 2);
            },

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            },

            updateUI() {
                const html = CONFIG.CHARACTERS.map(c => {
                    const aff = gameData.affections[c.id];
                    let level = '陌生 😐';
                    if (aff >= 40) level = '友好 😊';
                    if (aff >= 70) level = '亲密 😄';
                    return `
                        <div class="char-affection">
                            <div class="char-name">${c.emoji} ${c.name}</div>
                            <div class="affection-bar"><div class="affection-fill" style="width: ${Math.min(aff, 100)}%; background: ${c.color};"></div></div>
                            <div class="affection-level">${level}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('chars-affection').innerHTML = html;
            },

            saveGame() {
                localStorage.setItem('gameData', JSON.stringify(gameData));
                alert('游戏已保存！');
            },

            showSettings() {
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('settings-screen').classList.remove('hidden');
            },

            showAbout() {
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('about-screen').classList.remove('hidden');
            },

            showMenu() {
                document.getElementById('settings-screen').classList.add('hidden');
                document.getElementById('about-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('start-menu').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
